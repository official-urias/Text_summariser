[project]
name = "text-summariser"
version = "0.1.0"
description = "AI Text Summarizer - Modern Hybrid Application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "nltk>=3.8.1",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "google-genai>=0.1.1",
    "python-dotenv>=1.0.0",
    "pypdf>=4.0.0",
]

[tool.vercel]
entrypoint = "Text_Summariser.app:app"

[tool.pyright]
extraPaths = ["Text_Summariser"]
